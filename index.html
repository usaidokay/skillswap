<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="换技">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>换技 SkillSwap</title>
<meta name="description" content="右滑想换。用你会的，换你想学的。">
<style>
:root{
  --mag:hsl(303 86% 52%); --grn:#86f465; --ice:#bbeeff; --blu:hsl(213 92% 56%); --vio:hsl(270 84% 64%);
  --bg:#FAF8F3; --bg2:#F1EEE6; --card:#FFFFFF; --ink:#111110; --ink2:rgba(17,17,16,.62); --ink3:rgba(17,17,16,.4); --line:rgba(17,17,16,.1); --line2:rgba(17,17,16,.06);
  --hei:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --song:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
  --ital:"Didot","Bodoni 72","Georgia","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --spring:cubic-bezier(.2,1.35,.4,1); --out:cubic-bezier(.2,.8,.2,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
:root[data-theme=dark]{--bg:#0D0D0F;--bg2:#17171A;--card:#1C1C20;--ink:#F3F0E9;--ink2:rgba(243,240,233,.64);--ink3:rgba(243,240,233,.4);--line:rgba(243,240,233,.13);--line2:rgba(243,240,233,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:clip;background:var(--bg);color:var(--ink)}
body{font:15px/1.55 var(--hei);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ============ phone = the app ============ */
.phone{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;overflow:clip;z-index:10;user-select:none;-webkit-user-select:none}
.phone input,.phone textarea{user-select:text;-webkit-user-select:text}
.bar{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 18px 8px;flex:none}
.bar h1{font:600 22px/1 var(--hei);letter-spacing:-.02em;display:flex;align-items:baseline;gap:7px}
.bar h1 em{font:italic 400 15px var(--ital);color:var(--ink3)}
.bar .sp{flex:1}
.coinpill{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:99px;background:var(--bg2);font:600 13px var(--hei);font-variant-numeric:tabular-nums}
.coinpill svg{font-size:16px;color:var(--mag)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--bg2)}
.views{flex:1;position:relative;min-height:0;overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 18px 24px;display:none}
.view.on{display:block;animation:viewin .28s var(--out)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 10px calc(var(--sab) + 6px);border-top:1px solid var(--line2);background:var(--bg)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;color:var(--ink3);position:relative;transition:color .2s}
.tabbar button svg{font-size:23px;transition:transform .3s var(--spring)}
.tabbar button.on{color:var(--ink)}.tabbar button.on svg{transform:translateY(-1px) scale(1.08)}
.tabbar .dot{position:absolute;top:3px;left:calc(50% + 8px);min-width:15px;height:15px;border-radius:8px;background:var(--mag);color:#fff;font:600 9.5px/15px var(--hei);padding:0 4px}

/* deck */
#v-deck{padding:0;overflow:hidden;overflow:clip}
#v-deck.on{display:flex;flex-direction:column}
.stack{flex:1;position:relative;margin:2px 14px 0;min-height:0}
.card{position:absolute;inset:0;border-radius:26px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;touch-action:none;will-change:transform;container-type:inline-size;box-shadow:0 1px 0 var(--line2),0 18px 40px -22px rgba(0,0,0,.35);border:1px solid var(--line2);cursor:grab}
.card:active{cursor:grabbing}
.poster{flex:1.15;min-height:0;background:var(--c);color:#111;position:relative;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.poster .sk{font-family:var(--song);font-weight:400;line-height:.92;letter-spacing:-.04em;font-size:calc(86cqw / var(--n));white-space:nowrap;margin-left:-.04em}
.poster .sk.b{font-family:var(--hei);font-weight:800;letter-spacing:-.06em}
.poster .lv{font:500 11px var(--mono);letter-spacing:.06em;opacity:.7;margin-top:8px}
.poster .fit{position:absolute;top:14px;left:16px;display:flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:99px;padding:5px 11px 5px 8px;font:600 12px var(--hei)}
.poster .fit svg{font-size:14px;color:var(--grn)}
.poster .ok{position:absolute;top:19px;right:16px;font:500 10.5px var(--mono);letter-spacing:.08em;opacity:.65}
.stamp{position:absolute;top:22%;padding:6px 14px;border:3px solid;border-radius:10px;font:800 26px var(--hei);letter-spacing:.04em;opacity:0;pointer-events:none}
.stamp.like{left:18px;color:#0a5a18;border-color:#0a5a18;background:var(--grn);transform:rotate(-14deg)}
.stamp.nope{right:18px;color:#111;border-color:#111;background:#fff;transform:rotate(12deg)}
.stamp.sup{left:50%;top:auto;bottom:18%;transform:translateX(-50%);color:#fff;border-color:#fff;background:var(--mag);white-space:nowrap}
.info{flex:1;min-height:0;padding:14px 18px 16px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.info h3{font:600 23px/1.1 var(--hei);letter-spacing:-.02em;display:flex;align-items:baseline;gap:9px}
.info h3 small{font:400 12.5px var(--hei);color:var(--ink3);letter-spacing:0;display:flex;align-items:center;gap:3px}
.info .bio{font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.quote{margin-top:auto;padding-top:10px;border-top:1px solid var(--line2);font:400 13.5px/1.5 var(--song);color:var(--ink2);display:flex;flex-direction:column;gap:4px}.quote span:before{content:"“"}.quote span:after{content:"”"}.quote em{font:normal 500 10.5px var(--mono);letter-spacing:.04em;color:var(--ink3)}
.kv{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.kv>i{font:normal 500 10.5px var(--mono);color:var(--ink3);padding-top:5px;flex:none;width:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12.5px;background:var(--bg2);white-space:nowrap}
.chip.hit{background:var(--grn);color:#111;font-weight:600}
.chip.hit2{background:var(--ink);color:var(--bg);font-weight:600}
.chip.add{background:none;border:1.5px dashed var(--line);color:var(--ink2)}
.chip .x{opacity:.5;font-size:14px;line-height:1;margin-right:-2px}
.chip.pick{padding:7px 13px;font-size:13.5px}.chip.pick.on{background:var(--ink);color:var(--bg)}
.actions{flex:none;display:flex;justify-content:center;align-items:center;gap:16px;padding:14px 0 12px}
.act{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 20px -12px rgba(0,0,0,.4);transition:transform .25s var(--spring),background .2s}
.act:active{transform:scale(.88)}
.act.s{width:44px;height:44px;font-size:19px;color:var(--ink2)}
.act.nope{color:var(--ink)}.act.like{background:var(--grn);color:#111;border-color:transparent}.act.sup{background:var(--mag);color:#fff;border-color:transparent}
.deck-end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:0 8px 30px;gap:14px}
.deck-end b{font:400 44px/1 var(--song);letter-spacing:-.03em}
.deck-end p{color:var(--ink2);font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 20px;border-radius:99px;font:600 14.5px var(--hei);background:var(--bg2);transition:transform .2s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--ink);color:var(--bg)}.btn.grn{background:var(--grn);color:#111}.btn.mag{background:var(--mag);color:#fff}
.btn.sm{padding:8px 14px;font-size:13px}.btn.full{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}

/* lists */
.h2{font:400 34px/1 var(--song);letter-spacing:-.03em;margin:10px 0 16px}
.sub{font:500 10.5px var(--mono);letter-spacing:.1em;color:var(--ink3);margin:22px 0 10px;text-transform:uppercase}
.rowi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.rowi .t{flex:1;min-width:0}.rowi .t b{font-weight:600;display:block}.rowi .t p{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 17px var(--hei);color:#111;background:var(--c,var(--bg2));flex:none;position:relative}
.av.sm{width:34px;height:34px;font-size:13px}.av.lg{width:72px;height:72px;font-size:28px}
.av.blur{filter:blur(7px);opacity:.85}
.un{width:8px;height:8px;border-radius:50%;background:var(--mag);flex:none}
.likes{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--bg2);margin-bottom:6px}
.likes .avs{display:flex}.likes .avs .av{margin-right:-12px;border:2px solid var(--bg2)}
.likes .t{flex:1;margin-left:10px;font-size:13px;color:var(--ink2)}.likes .t b{display:block;font-size:15px;color:var(--ink)}
.likes>svg{font-size:18px;color:var(--ink2)}
.newm{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}.newm::-webkit-scrollbar{display:none}
.newm button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);flex:none}
.newm .av{outline:2.5px solid var(--grn);outline-offset:2px}
.empty{padding:40px 0;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}

/* pacts */
.pact{padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line2);margin-bottom:12px}
.pact-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pact-h b{font-size:16px;font-weight:600}.pact-h .m{font:500 10.5px var(--mono);color:var(--ink3);letter-spacing:.04em}
.st{margin-left:auto;font:600 10.5px var(--hei);padding:3px 9px;border-radius:6px;background:var(--bg2);color:var(--ink2)}
.st.active{background:var(--grn);color:#111}.st.pending{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
.leg{margin:10px 0}.leg .cap{display:flex;font-size:12.5px;color:var(--ink2);margin-bottom:7px}.leg .cap b{color:var(--ink);font-weight:600;margin-left:5px}.leg .cap span{margin-left:auto;font-family:var(--mono);font-size:11px}
.nodes{display:flex;align-items:center}
.nodes .sg{flex:1;height:2px;background:var(--line);max-width:40px}.nodes .sg.on{background:var(--ink)}
.nd{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11px var(--mono);color:var(--ink3);flex:none;transition:transform .25s var(--spring),background .2s}
.nd.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-size:15px}
.nd.next{border-color:var(--mag);color:var(--mag);border-style:dashed;animation:nudge 1.6s ease-in-out infinite}
.nd.next:active{transform:scale(.85)}
@keyframes nudge{50%{transform:scale(1.1)}}

/* me */
.mehead{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.mehead input{font:400 30px/1.1 var(--song);background:none;border:0;outline:0;width:100%;letter-spacing:-.02em}
.mehead p{font-size:12.5px;color:var(--ink3)}
.wallet{border-radius:24px;padding:18px;background:var(--ink);color:var(--bg);display:flex;align-items:flex-end;gap:12px;margin-top:22px;position:relative;overflow:hidden}
.wallet:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--mag)}
.wallet .n{font:800 60px/.85 var(--hei);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.wallet .l{font-size:12px;opacity:.65;padding-bottom:4px;flex:1}
.wallet .btn{position:relative;z-index:1;background:var(--bg);color:var(--ink)}
.plus{border-radius:24px;padding:16px 18px;background:var(--grn);color:#111;margin-top:10px;display:flex;align-items:center;gap:12px}
.plus b{font:800 19px var(--hei);letter-spacing:-.02em}.plus p{font-size:12.5px;opacity:.75}.plus>svg{font-size:20px}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2);font-size:14.5px;width:100%;text-align:left}
.setrow>svg{font-size:19px;color:var(--ink2)}.setrow>span{margin-left:auto;color:var(--ink3);font-size:13px}
.seg{display:flex;background:var(--bg2);border-radius:99px;padding:3px;margin-left:auto}
.seg button{padding:6px 13px;border-radius:99px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ledger div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--ink2)}
.ledger b{font:600 13px var(--mono);color:var(--ink)}.ledger b.neg{color:var(--mag)}

/* pushed page, sheet */
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s var(--out);z-index:20;visibility:hidden}
.page.on{transform:none;visibility:visible}
.page .bar{border-bottom:1px solid var(--line2);padding-top:6px}
.page .bar b{font-size:16px;font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 14px;border-radius:6px 18px 18px 18px;font-size:14.5px;background:var(--bg2);align-self:flex-start;user-select:text;-webkit-user-select:text}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-radius:18px 6px 18px 18px}
.msg.sys{align-self:center;background:none;color:var(--ink3);font-size:12px;text-align:center;max-width:90%}
.send{flex:none;display:flex;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--line2)}
.send input{flex:1;min-width:0;border:0;outline:0;background:var(--bg2);border-radius:99px;padding:11px 16px;font-size:16px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .3s;z-index:40;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--bg);border-radius:28px 28px 0 0;z-index:41;transform:translateY(105%);transition:transform .42s var(--out);display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px;flex:none}
.sheet .body{overflow-y:auto;padding:8px 20px 22px}
.sheet h2{font:400 30px/1.05 var(--song);letter-spacing:-.03em;margin:8px 0 6px}
.sheet .lead{font-size:13.5px;color:var(--ink2);margin-bottom:14px}
.fld{margin-top:16px}.fld>label{display:block;font:500 10.5px var(--mono);letter-spacing:.1em;color:var(--ink3);margin-bottom:8px;text-transform:uppercase}
.fld .seg{margin:0;width:100%}.fld .seg button{flex:1;justify-content:center;padding:9px 4px}
.fld input[type=text]{width:100%;background:var(--bg2);border:0;outline:0;border-radius:14px;padding:12px 14px;font-size:16px}
.lock{display:flex;align-items:center;gap:10px;padding:14px;border-radius:18px;background:var(--bg2);margin-top:8px}
.lock>svg{font-size:20px;color:var(--ink2)}.lock .t{flex:1;min-width:0}.lock .t b{display:block;font-weight:600;font-size:14.5px}.lock .t p{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock .t p.blurred{filter:blur(5px)}
.lock.open{background:var(--ice);color:#111}.lock.open>svg{color:#111}.lock.open .t p{color:rgba(0,0,0,.65);white-space:normal;user-select:text;-webkit-user-select:text}
.pack{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:18px;border:1.5px solid var(--line);margin-top:8px;width:100%;text-align:left}
.pack b{font:800 22px var(--hei);letter-spacing:-.03em}.pack p{font-size:12.5px;color:var(--ink3)}.pack>span{margin-left:auto;font:600 14px var(--hei);white-space:nowrap}
.pack.hot{border-color:transparent;background:var(--grn);color:#111}.pack.hot p{color:rgba(0,0,0,.6)}
.fine{font-size:11.5px;color:var(--ink3);margin-top:14px;text-align:center}
.rev{padding:12px 0;border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--ink2)}.rev i{font-style:normal;color:var(--mag);letter-spacing:2px;font-size:11px;display:block;margin-bottom:3px}

/* match moment */
.match{position:absolute;inset:0;z-index:50;background:var(--grn);color:#111;display:none;flex-direction:column;padding:calc(var(--sat) + 26px) 24px calc(var(--sab) + 24px);overflow:hidden}
.match.on{display:flex;animation:flood .55s var(--out)}
.match.chain{background:var(--mag);color:#fff}
@keyframes flood{from{clip-path:circle(0% at 50% 60%)}to{clip-path:circle(150% at 50% 60%)}}
.match .big{font:800 86px/.86 var(--hei);letter-spacing:-.07em;margin-left:-5px}
.match .big i{font:italic 400 .36em var(--ital);letter-spacing:-.01em;display:block;margin:10px 0 0 6px}
.match .ring{flex:1;min-height:0;width:100%}
.match .ring path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s var(--out) forwards}
.match .ring text{font:600 13px var(--hei);fill:currentColor}
.match .ring .nm{font-size:12px;opacity:.7;font-weight:400}
@keyframes draw{to{stroke-dashoffset:0}}
.match .say{font-size:14px;opacity:.85;margin-bottom:14px}
.match .acts{display:flex;flex-direction:column;gap:9px}
.match .btn{background:#111;color:#fff}.match .btn.ghost{background:rgba(0,0,0,.1);color:inherit}
.match.chain .btn{background:#fff;color:#111}.match.chain .btn.ghost{background:rgba(255,255,255,.18);color:#fff}

/* coach tip, toast, splash */
.tip{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 84px);z-index:45;background:var(--ink);color:var(--bg);border-radius:20px;padding:14px 16px;display:none;align-items:center;gap:12px;font-size:13.5px;box-shadow:0 18px 40px -14px rgba(0,0,0,.5)}
.tip.on{display:flex;animation:pop .45s var(--spring)}
.tip .g{display:flex;gap:6px 14px;flex:1;flex-wrap:wrap}.tip .g span{display:flex;align-items:center;gap:5px}.tip svg{font-size:16px}
.tip button{font-weight:600;color:var(--grn);flex:none;padding:4px}
:root[data-theme=dark] .tip button{color:#1d8a1d}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 9px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;animation:drop .4s var(--spring)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px)}}
.splash{position:absolute;inset:0;z-index:80;background:var(--grn);color:#111;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(var(--sab) + 34px);transition:transform .6s cubic-bezier(.7,0,.2,1);overflow:hidden}
.splash.off{transform:translateY(-101%)}
.splash .a{font:400 148px/.8 var(--song);letter-spacing:-.06em;margin-left:-10px;animation:sa .7s var(--out) both}
.splash .b{font:800 148px/.8 var(--hei);letter-spacing:-.08em;margin:-14px 0 0 64px;color:var(--mag);animation:sa .7s .12s var(--out) both}

function layoutStack(p){const cs=$$("#stack .card").reverse();cs.forEach((c,i)=>{if(i===0)return;const d=Math.max(0,i-p);c.style.transform=`translateY(${d*10}px) scale(${1-d*.045})`;c.style.pointerEvents="none"})}
function bindTop(){const el=$$("#stack .card").pop();if(!el)return;el.style.pointerEvents="auto";
  let sx=0,sy=0,dx=0,dy=0,drag=false,moved=false,g=1,hist=[],gone=false;
  const others=()=>$$("#stack .card").filter(c=>c!==el);
  const apply=()=>{el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx*.055*g}deg)`;const up=-dy>Math.abs(dx)*1.1;
    el.querySelector(".like").style.opacity=up?0:Math.max(0,Math.min(1,dx/90));el.querySelector(".nope").style.opacity=up?0:Math.max(0,Math.min(1,-dx/90));el.querySelector(".sup").style.opacity=up?Math.min(1,-dy/110):0;
    layoutStack(Math.min(1,Math.hypot(dx,dy)/150))};
  el.addEventListener("pointerdown",e=>{if(e.button||gone)return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;dx=dy=0;hist=[];const r=el.getBoundingClientRect();g=(e.clientY-r.top)<r.height*.55?1:-1;try{el.setPointerCapture(e.pointerId)}catch(_){}el.style.transition="none";others().forEach(c=>c.style.transition="none")});
  el.addEventListener("pointermove",e=>{if(!drag)return;dx=e.clientX-sx;dy=e.clientY-sy;if(Math.hypot(dx,dy)>7)moved=true;hist.push([performance.now(),e.clientX,e.clientY]);if(hist.length>6)hist.shift();apply()});
  const end=()=>{if(!drag)return;drag=false;if(!moved){reset();return openProfile(+el.dataset.id)}
    let vx=0,vy=0;if(hist.length>1){const a=hist[0],b=hist[hist.length-1],dt=Math.max(1,b[0]-a[0]);vx=(b[1]-a[1])/dt;vy=(b[2]-a[2])/dt}
    const up=-dy>Math.abs(dx)*1.1;
    if(up&&(-dy>120||vy<-.55))return fling("super",vx,vy);if(!up&&(dx>105||vx>.5))return fling("like",vx,vy);if(!up&&(dx<-105||vx<-.5))return fling("pass",vx,vy);reset()};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  function reset(){el.style.transition="transform .5s var(--spring)";dx=dy=0;el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);others().forEach(c=>c.style.transition="transform .4s var(--out)");layoutStack(0)}
  function fling(d,vx,vy){if(gone)return;if(d==="super"&&!canSuper()){reset();return}gone=true;
    const W=el.offsetWidth,dir=d==="like"?1:-1;el.style.transition="transform .42s cubic-bezier(.3,.6,.4,1)";
    el.style.transform=d==="super"?`translate(${dx}px,${-el.offsetHeight*1.3}px) rotate(${dx*.03}deg)`:`translate(${dir*W*1.5}px,${dy+vy*180}px) rotate(${dir*26*g}deg)`;
    el.querySelector("."+(d==="like"?"like":d==="pass"?"nope":"sup")).style.opacity=1;others().forEach(c=>c.style.transition="transform .4s var(--out)");layoutStack(1);
    setTimeout(()=>commit(+el.dataset.id,d),280)}
  el._fling=fling}
function canSuper(){if(S.supers>0||S.coins>0)return true;paySheet("超级想学用完了");return false}
function commit(id,d){S.swiped[id]=d;S.order.push(id);const u=uById(id);
  if(d==="super"){if(S.supers>0)S.supers--;else coin(-1,`超级想学 · ${u.name}`)}
  save();vDeck();vTop();if(d==="pass")return;
  const{get,give}=relate(u);
  if(get.length&&give.length)return matched({type:"mutual",uid:id,give:give[0],get:get[0]});
  if(give.length)return matched({type:"earn",uid:id,give:give[0]});
  if(get.length){const c=chainFor(u);if(c)return matched({type:"chain",uid:c.b.id,uid2:id,give:c.give,mid:c.mid,get:c.get});return coinOffer(u,get[0])}
  toast(d==="super"?`${u.name} 会先看到你`:"已右滑")}

  if(!S.plus)S.undos--;S.order.pop();delete S.swiped[id];save();vDeck();toast("回来了")}

function ringSVG(nodes,edges,inv){const n=nodes.length,R=84,c=130,a=k=>-Math.PI/2+k/n*Math.PI*2,pt=(k,r=R)=>[c+r*Math.cos(a(k)),c+r*Math.sin(a(k))],fg=inv?"#fff":"#111",bg=inv?"#111":"#fff";
  let h="";edges.forEach((t,j)=>{const[x0,y0]=pt(j),[x1,y1]=pt(j+1),m=(a(j)+a(j+1))/2,lx=c+(R+16)*Math.cos(m),ly=c+(R+16)*Math.sin(m);
    h+=`<path pathLength="1" style="animation-delay:${.35+j*.4}s" d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${Math.cos(m)>.3?"start":Math.cos(m)<-.3?"end":"middle"}">${esc(t)}</text>`});
  nodes.forEach((u,k)=>{const[x,y]=pt(k),[nx,ny]=pt(k,R-36);h+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="${u.id?bg:fg}" stroke="${fg}" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="middle" style="fill:${u.id?"#111":bg}">${esc(u.name[0])}</text><text class="nm" x="${nx.toFixed(1)}" y="${(ny+4).toFixed(1)}" text-anchor="middle">${esc(u.name)}</text>`});
  return `<svg class="ring" viewBox="-30 0 320 260">${h}</svg>`}
function matched(m){m.t=Date.now();S.matches.push(m);const u=uById(m.uid),u2=m.uid2&&uById(m.uid2);
  pushMsg(m.uid,"sys",m.type==="chain"?`你、${u.name}、${u2.name} 连成了一个三人环`:"你们互相右滑了");if(u2)pushMsg(m.uid2,"sys",`你、${u.name}、${u2.name} 连成了一个三人环`);save();
  const chain=m.type==="chain",nodes=chain?[S.me,u,u2]:[S.me,u],edges=chain?[m.give,m.mid,m.get]:m.type==="mutual"?[m.give,m.get]:[m.give,"+1 时间币"];
  const el=$("#match");el.className="match on"+(chain?" chain":"");
  el.innerHTML=`<div class="big">${chain?"三人环":"成环了"}<i>${chain?"three make a loop":m.type==="earn"?"you teach, you earn":"it's a loop"}</i></div>${ringSVG(nodes,edges,chain)}
    <p class="say">${chain?`${esc(u2.name)} 不需要你会的，但 ${esc(u.name)} 需要；${esc(u.name)} 会的，${esc(u2.name)} 正好想学。`:m.type==="earn"?`${esc(u.name)} 想学你的 ${esc(m.give)}。教一小时，得一枚时间币。`:`你教 ${esc(m.give)}，${esc(u.name)} 教你 ${esc(m.get)}。`}</p>
    <div class="acts"><button class="btn" data-act="pact" data-i="${S.matches.length-1}">立约</button><button class="btn ghost" data-act="chat" data-id="${(u2||u).id}">先聊聊</button><button class="btn ghost" data-act="closematch">继续滑</button></div>`;vTop()}

function sheet(html){$("#sheet").innerHTML=`<div class="grab"></div><div class="body">${html}</div>`;requestAnimationFrame(()=>{$("#sheet").classList.add("on");$("#scrim").classList.add("on")})}
function closeSheet(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on")}
function toast(t){$$(".toast").forEach(e=>e.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;$("#phone").appendChild(d);setTimeout(()=>d.remove(),2200)}
const TIPS={deck:`<div class="g"><span>${ic("go")}右滑想换</span><span>${ic("back")}左滑跳过</span><span>${ic("star")}上滑超级想学</span></div>`,pact:`<div class="g"><span>每上完一节，点一下方格打卡</span></div>`,chat:`<div class="g"><span>想看 TA 的微信或作品集，点右上角「公开」</span></div>`};
function tip(k){if(S.tips[k]||!$("#splash").classList.contains("off"))return;const t=$("#tip");t.dataset.k=k;t.innerHTML=TIPS[k]+`<button data-act="tipok">知道了</button>`;t.classList.add("on")}
function hideTip(){$("#tip").classList.remove("on")}
function setTheme(v){S.theme=v;document.documentElement.dataset.theme=v;const m=$('meta[name=theme-color]');if(m)m.content=v==="dark"?"#0D0D0F":"#FAF8F3";const l=$("#themeLbl");if(l){l.textContent=v==="dark"?"夜间":"日间";$("#themeIc").innerHTML=`<use href="#i-${v==="dark"?"moon":"sun"}"/>`}save()}
function openProfile(id){const u=uById(id),{get,give}=relate(u);
  sheet(`<div style="display:flex;align-items:center;gap:14px;margin-top:6px">${av(u,"lg")}<div><h2 style="margin:0">${esc(u.name)}</h2><p style="font-size:12.5px;color:var(--ink3)">${esc(u.city)} · ★ ${u.rating} · 已换 ${u.swaps} 次${u.ok?" · 已实名":""}</p></div></div>
  <p style="margin:14px 0 4px;color:var(--ink2);font-size:14px">${esc(u.bio)}</p>
  <div class="sub">能教</div>${u.teach.map(t=>`<div class="rowi" style="padding:9px 0"><span class="chip ${get.includes(t.s)?"hit":""}">${esc(t.s)}</span><span style="font-size:12.5px;color:var(--ink3)">${esc(t.lv)}</span></div>`).join("")}
  <div class="sub">想学</div><div class="chips">${u.learn.map(s=>`<span class="chip ${give.includes(s)?"hit2":""}">${esc(s)}</span>`).join("")}</div>
  <div class="sub">空闲</div><div class="chips">${u.times.map(t=>`<span class="chip ${S.me.times.includes(t)?"hit2":""}">${t}</span>`).join("")}<span class="chip">${u.mode==="均可"?"线上线下均可":u.mode}</span></div>
  <div class="sub">评价</div>${[0,1].map(i=>`<div class="rev"><i>★★★★★</i>${REVIEWS[(u.id+i*2)%6]}</div>`).join("")}
  <div class="lock" style="margin-top:12px">${ic("lock")}<div class="t"><b>完整评价 · 微信 · 作品集</b><p>成环之后可以请对方公开</p></div></div>
  ${S.swiped[id]?"":`<div style="display:flex;gap:10px;margin-top:20px"><button class="btn full" data-act="sheetswipe" data-d="pass">跳过</button><button class="btn grn full" data-act="sheetswipe" data-d="like">${ic("loop")}想换</button></div>`}`)}

/* ================= events ================= */
const topCard=()=>$$("#stack .card").pop();
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,d=el.dataset;
  if(a==="tab")setTab(d.v);
  else if(a==="swipe"){const t=topCard();t&&t._fling&&t._fling(d.d,0,0)}
  else if(a==="sheetswipe"){closeSheet();setTimeout(()=>{const t=topCard();t&&t._fling&&t._fling(d.d,0,0)},260)}
  else if(a==="undo")undo();
  else if(a==="redeck"){S.swiped={};S.order=[];save();vDeck()}
  else if(a==="closematch")$("#match").classList.remove("on");
  else if(a==="pact"){$("#match").classList.remove("on");pactSheet(S.matches[+d.i])}
  else if(a==="coinpact"){closeSheet();setTimeout(()=>pactSheet({type:"coin",uid:+d.id,get:d.s}),320)}
  else if(a==="seg"){el.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===el));ui.draft[el.parentElement.dataset.seg]=d.v}
  else if(a==="sendpact"){if(ui.draft.m.type==="coin"&&S.coins<1){closeSheet();return setTimeout(()=>paySheet("时间币不够了"),320)}createSwap(ui.draft);closeSheet();setTab("pact");toast("邀请发出去了")}
  else if(a==="tick"){const s=S.swaps.find(x=>x.id===+d.id);if(!s)return;
    if(d.k==="doneGet"&&s.type==="coin"){if(S.coins<1)return paySheet("时间币不够了");coin(-1,`向 ${uById(s.uid).name} 学 ${s.get}`)}
    if(d.k==="doneGive"&&s.type==="earn")coin(1,`教 ${uById(s.uid).name} ${s.give}`);
    s[d.k]++;if(!((s.give?s.total-s.doneGive:0)+(s.get?s.total-s.doneGet:0))){s.status="done";toast("这份约课上完了")}S.tips.pact=1;save();hideTip();renderAll()}
  else if(a==="review"){ui.stars=5;sheet(`<h2>这次换得<br>怎么样</h2><div class="fld" id="stars" style="font-size:34px;letter-spacing:6px;color:var(--mag)">${[1,2,3,4,5].map(i=>`<button data-act="star" data-v="${i}">★</button>`).join("")}</div><div class="fld"><label>留一句</label><input type="text" id="revtext" placeholder="守时吗？讲得清楚吗？"></div><button class="btn pri full" style="margin-top:22px" data-act="sendreview" data-id="${d.id}">提交 · +1 时间币</button>`)}
  else if(a==="star"){ui.stars=+d.v;$$("#stars button").forEach((b,i)=>b.style.opacity=i<ui.stars?1:.25)}
  else if(a==="sendreview"){const s=S.swaps.find(x=>x.id===+d.id);if(!s)return;s.reviewed=ui.stars;coin(1,"完成互评");closeSheet();renderAll();toast("+1 时间币")}
  else if(a==="chat"){$("#match").classList.remove("on");closeSheet();if(ui.tab!=="chat")setTab("chat");openChat(+d.id)}
  else if(a==="back"){$("#page").classList.remove("on");ui.thread=null;hideTip();vChat();vTop()}
  else if(a==="reveal"){S.tips.chat=1;save();hideTip();revealSheet(+d.id)}
  else if(a==="ask"){const id=+d.id,k=d.k,u=uById(id),x=INFO(u)[k];(S.reveal[id]=S.reveal[id]||{})[k]="asked";pushMsg(id,"me",`可以看看你的${x.n}吗？`);save();revealSheet(id);drawMsgs();
    setTimeout(()=>{const yes=k!=="contact"&&u.ok;if(yes){S.reveal[id][k]=true;pushMsg(id,"them","可以呀，给你开了");pushMsg(id,"sys",`${u.name} 公开了${x.n}`)}else pushMsg(id,"them",k==="contact"?"微信等上完试课再加吧～":"晚点整理好发你");save();drawMsgs();vTop();if($("#sheet").classList.contains("on"))revealSheet(id)},1600)}
  else if(a==="unlock"){const id=+d.id,x=INFO(uById(id))[d.k];if(S.coins<x.cost){closeSheet();return setTimeout(()=>paySheet("时间币不够了"),320)}coin(-x.cost,`解锁 ${uById(id).name} 的${x.n}`);(S.reveal[id]=S.reveal[id]||{})[d.k]=true;save();revealSheet(id);vTop()}
  else if(a==="likes"){if(!S.plus)return paySheet("谁右滑了你");sheet(`<h2>右滑了你的人</h2>${likedMe().map(u=>`<button class="rowi" data-act="peek" data-id="${u.id}" style="width:100%;text-align:left">${av(u)}<span class="t"><b>${esc(u.name)}</b><p>想学 ${relate(u).give.map(esc).join("、")}</p></span>${ic("go")}</button>`).join("")}`)}
  else if(a==="peek"){closeSheet();setTimeout(()=>openProfile(+d.id),320)}
  else if(a==="pay")paySheet();
  else if(a==="buy"){coin(+d.n,"充值（演示）");closeSheet();renderAll();toast(`+${d.n} 时间币`)}
  else if(a==="plus"){if(!S.plus){S.plus=true;S.supers=5;coin(5,"换技+ 月赠")}closeSheet();renderAll();toast("换技+ 已开通（演示）")}
  else if(a==="closesheet")closeSheet();
  else if(a==="tipok"){S.tips[$("#tip").dataset.k]=1;save();hideTip()}
  else if(a==="retip"){S.tips={};save();setTab("deck")}
  else if(a==="theme"){setTheme(d.v||(S.theme==="dark"?"light":"dark"));if(ui.tab==="me")vMe()}
  else if(a==="rm"){S.me[d.k]=S.me[d.k].filter(s=>s!==d.s);save();vMe()}
  else if(a==="addskill"){const k=d.k;sheet(`<h2>${k==="teach"?"你会什么":"你想学什么"}</h2>${Object.entries(CATS).map(([c,ss])=>`<div class="fld"><label>${c}</label><div class="chips">${ss.map(s=>`<button class="chip pick ${S.me[k].includes(s)?"on":""}" data-act="toggleskill" data-k="${k}" data-s="${s}">${s}</button>`).join("")}</div></div>`).join("")}<form class="fld" data-form="custom" data-k="${k}"><label>没有就自己写</label><div style="display:flex;gap:8px"><input type="text" name="s" maxlength="10" placeholder="手冲咖啡"><button class="btn pri sm">加</button></div></form><button class="btn pri full" style="margin-top:20px" data-act="closesheet">好了</button>`)}
  else if(a==="toggleskill"){const arr=S.me[d.k];S.me[d.k]=arr.includes(d.s)?arr.filter(s=>s!==d.s):[...arr,d.s];save();el.classList.toggle("on");vMe()}
  else if(a==="reset"){if(confirm("清空本机的演示数据？")){try{localStorage.removeItem(KEY)}catch(_){}S=fresh();setTheme("light");setTab("deck")}}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,fd=new FormData(f);
  if(f.dataset.form==="send"){const t=(fd.get("t")||"").trim(),id=ui.thread;if(!t||id==null)return;pushMsg(id,"me",t);save();f.reset();drawMsgs();setTimeout(()=>{pushMsg(id,"them",REPLIES[Math.floor(Math.random()*REPLIES.length)]);save();drawMsgs();vTop()},1300)}
  else if(f.dataset.form==="custom"){const s=(fd.get("s")||"").trim(),k=f.dataset.k;if(s&&!S.me[k].includes(s)){S.me[k].push(s);save();vMe();f.reset();toast(`加上了「${s}」`)}}});
document.addEventListener("change",e=>{if(e.target.id==="myname"){S.me.name=e.target.value.trim()||"我";save();vMe()}});
addEventListener("keydown",e=>{if(e.target.matches("input,textarea")||ui.tab!=="deck"||$("#sheet").classList.contains("on")||$("#match").classList.contains("on"))return;const d={ArrowRight:"like",ArrowLeft:"pass",ArrowUp:"super"}[e.key];if(!d)return;e.preventDefault();const t=topCard();t&&t._fling&&t._fling(d,0,0)});

["#phone",".views","#v-deck"].forEach(q=>{const n=$(q);n.addEventListener("scroll",()=>{n.scrollLeft=0;if(q!=="#v-deck"||true)n.scrollTop=0})});

/* ================= boot ================= */
setTheme(S.theme||"light");
S.swaps.filter(s=>s.status==="pending").forEach(s=>setTimeout(()=>accept(s.id),1500));
setTab("deck");
const seenSplash=(()=>{try{return sessionStorage.getItem("sk_splash")}catch(e){return 0}})();
if(seenSplash){$("#splash").classList.add("off");tip("deck")}
else setTimeout(()=>{$("#splash").classList.add("off");try{sessionStorage.setItem("sk_splash",1)}catch(e){}setTimeout(()=>tip("deck"),600)},1500);
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
